<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Kalp Yolu: Pro Runner v6.0</title>
  <style>
    :root { --p: #00d4ff; --a: #ff007b; --bg: #05070a; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; color: #fff; }
    #wrap { height:100%; display:flex; align-items:center; justify-content:center; }
    canvas {
      width: min(100vw, 520px); height: min(100vh, 900px);
      border-radius: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
      background: #000; touch-action: none; display:block;
    }
    .ui { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:100; }
    .panel {
      pointer-events:auto; background: rgba(10,20,35,0.96); padding:30px; border-radius:30px;
      width:340px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align:center;
    }
    h1 { margin:0 0 10px; font-size:32px; letter-spacing:5px; color: var(--p); text-shadow: 0 0 10px var(--p); }
    .scroll { max-height: 350px; overflow-y: auto; margin: 15px 0; padding-right: 5px; }
    button {
      display:block; width:100%; padding:15px; margin:10px 0; border:none; border-radius:15px;
      background: var(--p); color:#000; font-weight:bold; font-size:16px; cursor:pointer; transition: 0.2s;
    }
    button:hover { filter: brightness(1.2); transform: scale(1.02); }
    button.sec { background: rgba(255,255,255,0.1); color:#fff; }
    button.buy { background: var(--a); color:#fff; padding: 8px; font-size:12px; width:70px; }
    .hidden { display:none !important; }
    .item { background: rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; text-align:left; }
    .item-name { font-weight:bold; color: var(--p); display:block; }
    .item-desc { font-size:11px; opacity:0.6; }
    #mission-box { position:absolute; top:80px; left:20px; text-align:left; pointer-events:none; }
    .mission-tag { background:rgba(0,0,0,0.6); padding:5px 10px; border-radius:8px; border-left:3px solid var(--a); margin-bottom:5px; font-size:12px; }
  </style>
</head>
<body>

<div id="wrap"><canvas id="c"></canvas></div>

<div id="mission-box"></div>

<div id="uiMenu" class="ui">
  <div class="panel">
    <h1>KALP YOLU</h1>
    <p id="menuStats" style="font-size:14px; opacity:0.8;"></p>
    <button id="btnStart">KOŞUYA BAŞLA</button>
    <button id="btnShop" class="sec">MARKET & SKINLER</button>
    <button id="btnSettings" class="sec">AYARLAR</button>
    <button id="btnPatch" class="sec">YAMA NOTLARI (v6.0)</button>
  </div>
</div>

<div id="uiShop" class="ui hidden">
  <div class="panel" style="width:380px;">
    <h1>MARKET</h1>
    <div id="wallet" style="color:#ffd700; font-weight:bold; margin-bottom:10px;"></div>
    <div class="scroll" id="shopItems"></div>
    <button id="btnBackShop" class="sec">ANA MENÜ</button>
  </div>
</div>

<div id="uiPatch" class="ui hidden">
  <div class="panel">
    <h1>GÜNCELLEME</h1>
    <div class="scroll" style="text-align:left; font-size:13px; line-height:1.6;">
      <b style="color:var(--p)">v6.0 Efsane Güncelleme:</b><br>
      - Engel oluşum mantığı sıfırdan yazıldı (Artık takılmak yok).<br>
      - Görev Sistemi: Ödüllü görevler eklendi.<br>
      - Prosedürel Arka Plan: Siber Şehir ve Dağlar.<br>
      - Synthwave Müzik Motoru eklendi.<br>
      - 6 yeni Skin ve Seviye sistemi.
    </div>
    <button onclick="showMenu('uiMenu')" class="sec">KAPAT</button>
  </div>
</div>

<script>
/** 1. VERİ SİSTEMİ VE SKINLER **/
const SKINS = {
  classic: { n: "Klasik", c: "#00d4ff", a: "#fff", p: 0, d: "Standart robot." },
  neon: { n: "Neon Green", c: "#39ff14", a: "#fff", p: 200, d: "Gece parlaması." },
  ruby: { n: "Ruby Red", c: "#ff0033", a: "#fff", p: 500, d: "Hız tutkunu." },
  gold: { n: "Golden", c: "#ffd700", a: "#fff", p: 1000, d: "Para mıknatısı." },
  void: { n: "Void", c: "#8a2be2", a: "#000", p: 2500, d: "Gizemli güç." },
  mint: { n: "Minty", c: "#00ffcc", a: "#fff", p: 5000, d: "Çok havalı." }
};

let state = JSON.parse(localStorage.getItem("kalp_yolu_v6")) || {
  coins: 0, high: 0, xp: 0, 
  owned: ["classic"], skin: "classic",
  missions: [
    { id: 1, t: "500m Koş", goal: 500, cur: 0, rew: 50, done: false },
    { id: 2, t: "20 Para Topla", goal: 20, cur: 0, rew: 30, done: false }
  ],
  sett: { music: true, sfx: true }
};
const save = () => localStorage.setItem("kalp_yolu_v6", JSON.stringify(state));

/** 2. SES MOTORU (Synthwave) **/
const audio = new (window.AudioContext || window.webkitAudioContext)();
let bgMusic = null;

function playSfx(f, t='sine', d=0.2, v=0.1) {
  if(!state.sett.sfx) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = t; o.frequency.setValueAtTime(f, audio.currentTime);
  g.gain.setValueAtTime(v, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + d);
}

function startMusic() {
  if(!state.sett.music || bgMusic) return;
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(55, audio.currentTime); // Bassline
  g.gain.setValueAtTime(0.02, audio.currentTime);
  osc.connect(g); g.connect(audio.destination);
  osc.start(); bgMusic = osc;
}
function stopMusic() { if(bgMusic) { try{bgMusic.stop();}catch(e){} bgMusic=null; } }

/** 3. OYUN MOTORU **/
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
let W, H, run = null, stars = [], buildings = [];

function initAssets() {
  stars = Array.from({length: 80}, () => ({x: Math.random()*2-1, y: Math.random()*2-1, s: Math.random()}));
  buildings = Array.from({length: 15}, (_, i) => ({x: (i-7)*1.5, h: 50 + Math.random()*150, w: 40 + Math.random()*40}));
}

function resize() { W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }
window.onresize = resize; resize(); initAssets();

const player = { lane: 1, x: 0, jumpT: 0, slideT: 0, shield: 0 };

function resetRun() {
  stopMusic(); startMusic();
  run = { active: true, score: 0, coins: 0, speed: 0.18, objs: [], nextZ: 10, shake: 0 };
  player.lane = 1; player.x = W/2; player.jumpT = 0; player.slideT = 0;
  updateMissionUI();
}

/** 4. ÇİZİM VE HATA GİDERİLMİŞ SPAWN **/
function getPos(l, z) {
  const p = 1 / (z + 1);
  return { x: W/2 + (l - 1) * (W * 0.4) * p, y: H * 0.75 - (z * 20 * p), s: p };
}

function drawBackground() {
  // Gökyüzü ve Yıldızlar
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, "#05070a"); g.addColorStop(0.5, "#1a0b2e");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  
  stars.forEach(s => {
    const x = W/2 + s.x * W * 0.5; const y = H/2 + s.y * H * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${s.s})`; ctx.fillRect(x, y, 2, 2);
  });

  // Şehir Silüeti
  buildings.forEach(b => {
    const z = 40; const p = getPos(b.x, z);
    ctx.fillStyle = "#0a0510";
    ctx.fillRect(p.x - b.w*p.s, p.y - b.h*p.s, b.w*p.s*2, b.h*p.s);
    ctx.strokeStyle = "rgba(0, 212, 255, 0.2)"; ctx.strokeRect(p.x - b.w*p.s, p.y - b.h*p.s, b.w*p.s*2, b.h*p.s);
  });

  // Yol
  ctx.fillStyle = "#0f172a"; ctx.beginPath();
  ctx.moveTo(W*0.05, H); ctx.lineTo(W*0.45, H*0.4); ctx.lineTo(W*0.55, H*0.4); ctx.lineTo(W*0.95, H); ctx.fill();
}

function loop() {
  if(!run || !run.active) return;
  drawBackground();

  run.score += run.speed;
  run.speed += 0.00004;

  // Engel Mantığı (Hatasız)
  run.nextZ -= run.speed;
  if(run.nextZ <= 0) {
    const lane = Math.floor(Math.random()*3);
    const type = Math.random() < 0.3 ? "spike" : Math.random() < 0.5 ? "bar" : "coin";
    
    // Güvenli mesafe kontrolü
    const last = run.objs[run.objs.length-1];
    if(!last || (50 - last.z > 5)) {
      run.objs.push({t: type, l: lane, z: 50});
      run.nextZ = 6 + Math.random()*8;
    }
  }

  run.objs.forEach((o, i) => {
    o.z -= run.speed;
    const p = getPos(o.l, o.z);
    if(o.z < 0 || o.z > 50) return;

    if(o.t === "coin") {
      ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(p.x, p.y-25*p.s, 15*p.s, 0, 7); ctx.fill();
      ctx.shadowBlur = 10; ctx.shadowColor = "#ffd700"; ctx.stroke(); ctx.shadowBlur = 0;
    } else if(o.t === "spike") {
      ctx.fillStyle = "#ff0044"; ctx.beginPath(); ctx.moveTo(p.x-30*p.s, p.y); ctx.lineTo(p.x, p.y-60*p.s); ctx.lineTo(p.x+30*p.s, p.y); ctx.fill();
    } else if(o.t === "bar") {
      ctx.fillStyle = "#00d4ff"; ctx.fillRect(p.x-50*p.s, p.y-100*p.s, 100*p.s, 15*p.s);
    }

    // Çarpışma
    if(o.z > 0 && o.z < 1.2 && Math.abs(o.l - player.lane) < 0.5) {
      if(o.t === "coin") {
        run.coins++; state.coins++; playSfx(800); run.objs.splice(i,1);
        checkMissions("coin");
      } else {
        if((o.t === "spike" && player.jumpT <= 0) || (o.t === "bar" && player.slideT <= 0)) gameOver();
      }
    }
  });

  // Robot Çizimi
  const skin = SKINS[state.skin];
  player.x += (getPos(player.lane, 0).x - player.x) * 0.2;
  let jy = 0; 
  if(player.jumpT > 0) { jy = -Math.sin((1-player.jumpT/0.6)*Math.PI)*120; player.jumpT -= 0.016; }
  if(player.slideT > 0) player.slideT -= 0.016;

  ctx.save(); ctx.translate(player.x, H * 0.88 + jy);
  const w = player.slideT > 0 ? 60 : 45, h = player.slideT > 0 ? 30 : 70;
  ctx.fillStyle = skin.c; ctx.beginPath(); ctx.roundRect(-w/2, -h, w, h, 10); ctx.fill();
  ctx.fillStyle = "#000"; ctx.fillRect(-w/2+5, -h+10, w-10, 15);
  ctx.fillStyle = skin.a; ctx.fillRect(-w/2+10, -h+15, w-20, 3);
  ctx.restore();

  // HUD
  ctx.fillStyle = "#fff"; ctx.font = "bold 20px Arial";
  ctx.fillText(`${Math.floor(run.score)}m`, W-100, 45);
  ctx.fillStyle = "#ffd700"; ctx.fillText(`💰 ${run.coins}`, 25, 45);

  run.objs = run.objs.filter(o => o.z > -1);
  checkMissions("run");
  requestAnimationFrame(loop);
}

function gameOver() {
  run.active = false; stopMusic(); playSfx(100, 'sawtooth', 0.4, 0.2);
  if(run.score > state.high) state.high = Math.floor(run.score);
  state.xp += Math.floor(run.score / 10);
  save();
  document.getElementById("overStats").innerHTML = `Skor: ${Math.floor(run.score)}m<br>Para: ${run.coins}<br>Toplam XP: ${state.xp}`;
  showMenu("uiOver");
}

/** 5. GÖREV VE MARKET SİSTEMİ **/
function checkMissions(type) {
  state.missions.forEach(m => {
    if(m.done) return;
    if(type === "coin" && m.t.includes("Para")) m.cur++;
    if(type === "run" && m.t.includes("Koş")) m.cur = Math.max(m.cur, Math.floor(run.score));
    if(m.cur >= m.goal) { m.done = true; state.coins += m.rew; playSfx(1200); updateMissionUI(); }
  });
}

function updateMissionUI() {
  const box = document.getElementById("mission-box");
  box.innerHTML = state.missions.filter(m => !m.done).map(m => `
    <div class="mission-tag">${m.t} (${m.cur}/${m.goal})</div>
  `).join("");
}

function renderShop() {
  const list = document.getElementById("shopItems");
  list.innerHTML = ""; document.getElementById("wallet").innerText = `Bakiye: ${state.coins} 💰`;
  for(let id in SKINS) {
    const s = SKINS[id], owned = state.owned.includes(id), sel = state.skin === id;
    list.innerHTML += `
      <div class="item">
        <div class="item-info">
          <span class="item-name" style="color:${s.c}">${s.n} ${sel ? '✓' : ''}</span>
          <span class="item-desc">${s.d}</span>
        </div>
        <button class="buy" onclick="buySkin('${id}')">${owned ? (sel ? 'Seçili' : 'Seç') : s.p + ' 💰'}</button>
      </div>`;
  }
}

window.buySkin = (id) => {
  if(state.owned.includes(id)) state.skin = id;
  else if(state.coins >= SKINS[id].p) { state.coins -= SKINS[id].p; state.owned.push(id); state.skin = id; playSfx(1000); }
  save(); renderShop();
};

/** 6. KONTROLLER VE UI **/
function showMenu(id) {
  document.querySelectorAll(".ui").forEach(u => u.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  if(id === "uiMenu") document.getElementById("menuStats").innerHTML = `Rekor: ${state.high}m | Toplam XP: ${state.xp}`;
}

const move = (d) => {
  if(!run?.active) return;
  if(d === "L" && player.lane > 0) player.lane--;
  if(d === "R" && player.lane < 2) player.lane++;
  if(d === "U" && player.jumpT <= 0) { player.jumpT = 0.6; playSfx(500, 'triangle'); }
  if(d === "D") player.slideT = 0.6;
};

window.onkeydown = e => {
  if(e.key === "ArrowLeft") move("L"); if(e.key === "ArrowRight") move("R");
  if(e.key === "ArrowUp") move("U"); if(e.key === "ArrowDown") move("D");
};

// Touch/Swipe
let tx, ty;
canvas.ontouchstart = e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; };
canvas.ontouchend = e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "R" : "L");
  else move(dy > 0 ? "D" : "U");
};

document.getElementById("btnStart").onclick = () => { showMenu("none"); resetRun(); loop(); };
document.getElementById("btnShop").onclick = () => { showMenu("uiShop"); renderShop(); };
document.getElementById("btnBackShop").onclick = () => showMenu("uiMenu");
document.getElementById("btnSettings").onclick = () => showMenu("uiSettings");
document.getElementById("btnPatch").onclick = () => showMenu("uiPatch");

showMenu("uiMenu");
</script>

<div id="uiSettings" class="ui hidden">
  <div class="panel">
    <h1>AYARLAR</h1>
    <button onclick="state.sett.music=!state.sett.music; save(); this.innerText='MÜZİK: '+(state.sett.music?'AÇIK':'KAPALI')">MÜZİK: AÇIK</button>
    <button onclick="state.sett.sfx=!state.sett.sfx; save(); this.innerText='SES: '+(state.sett.sfx?'AÇIK':'KAPALI')">SES: AÇIK</button>
    <button onclick="if(confirm('Sıfırlansın mı?')){state=null; location.reload();}" style="background:#ff4444; color:#fff;">VERİLERİ SIFIRLA</button>
    <button onclick="showMenu('uiMenu')" class="sec">GERİ DÖN</button>
  </div>
</div>

<div id="uiOver" class="ui hidden">
  <div class="panel">
    <h1>EYVAH!</h1>
    <div id="overStats" style="margin-bottom:20px; font-size:15px;"></div>
    <button onclick="showMenu('none'); resetRun(); loop();">TEKRAR DENE</button>
    <button onclick="location.reload()" class="sec">ANA MENÜ</button>
  </div>
</div>

</body>
</html>
