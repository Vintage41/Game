<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pax Historia: Fetih</title>
    <style>
        body { background: #0f0f0f; color: #d4af37; font-family: 'Georgia', serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h1 { margin: 10px; text-transform: uppercase; letter-spacing: 3px; }
        #ui-top { display: flex; gap: 30px; background: #1a1a1a; padding: 15px; border-radius: 0 0 15px 15px; border: 1px solid #d4af37; margin-bottom: 10px; }
        #game-layout { display: flex; gap: 15px; }
        canvas { background: #000; border: 3px solid #333; border-radius: 10px; cursor: crosshair; }
        #controls { width: 250px; background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .log { height: 120px; background: #000; padding: 5px; font-size: 11px; overflow-y: auto; color: #aaa; margin-top: 10px; border: 1px solid #333; }
        button { width: 100%; padding: 10px; margin-top: 5px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { background: #fff; color: #000; }
        .selected-info { color: #fff; font-size: 14px; margin-bottom: 10px; padding: 5px; background: #333; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="ui-top">
        <div>💰 Altın: <span id="gold">100</span></div>
        <div>⚔️ Toplam Ordu: <span id="total-army">0</span></div>
        <div>📅 Yıl: <span id="year">1453</span></div>
    </div>

    <div id="game-layout">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div id="controls">
            <div id="selected-province" class="selected-info">Bölge Seçiniz</div>
            <button onclick="recruitArmy()">Asker Al (-20 Altın)</button>
            <button onclick="endTurn()" style="background: #27ae60; color: white; margin-top: 20px;">TURU BİTİR</button>
            <div class="log" id="gameLog">Hoş geldin komutan! Bir bölgene tıkla ve asker bas.</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const log = document.getElementById('gameLog');

    let gold = 100;
    let year = 1453;
    let selectedId = null;

    let provinces = [
        { id: 0, name: "Konstantiniyye", x: 100, y: 100, army: 20, owner: 'player' },
        { id: 1, name: "Anadolu", x: 300, y: 120, army: 15, owner: 'player' },
        { id: 2, name: "Venedik", x: 100, y: 280, army: 25, owner: 'ai' },
        { id: 3, name: "Viyana", x: 350, y: 260, army: 30, owner: 'ai' },
        { id: 4, name: "Atina", x: 220, y: 200, army: 10, owner: 'neutral' }
    ];

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        provinces.forEach(p => {
            // Renk Belirleme
            if(p.owner === 'player') ctx.fillStyle = '#2980b9';
            else if(p.owner === 'ai') ctx.fillStyle = '#c0392b';
            else ctx.fillStyle = '#7f8c8d';

            // Seçili olma efekti
            if(selectedId === p.id) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
            } else {
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 1;
            }

            ctx.beginPath();
            ctx.roundRect(p.x, p.y, 120, 70, 10);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = "bold 12px Arial";
            ctx.fillText(p.name, p.x + 10, p.y + 25);
            ctx.fillText("⚔️ " + p.army, p.x + 10, p.y + 55);
        });
        updateUI();
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        provinces.forEach(p => {
            if(mx > p.x && mx < p.x + 120 && my > p.y && my < p.y + 70) {
                if(selectedId !== null && provinces[selectedId].owner === 'player' && p.owner !== 'player') {
                    attack(selectedId, p.id);
                } else {
                    selectedId = p.id;
                    document.getElementById('selected-province').innerText = p.name + " (" + p.owner + ")";
                }
            }
        });
        draw();
    });

    function recruitArmy() {
        if(selectedId === null || provinces[selectedId].owner !== 'player') {
            addLog("Önce kendi bölgeni seç!"); return;
        }
        if(gold >= 20) {
            gold -= 20;
            provinces[selectedId].army += 10;
            addLog(provinces[selectedId].name + " bölgesine asker alındı.");
            draw();
        } else { addLog("Yetersiz altın!"); }
    }

    function attack(fromId, toId) {
        let from = provinces[fromId];
        let to = provinces[toId];
        
        addLog(from.name + " -> " + to.name + " SALDIRI!");
        
        if(from.army > to.army) {
            let remains = from.army - to.army;
            to.army = Math.floor(remains * 0.7);
            from.army = Math.floor(remains * 0.3);
            to.owner = 'player';
            addLog("Zafer! Bölge fethedildi.");
        } else {
            to.army -= Math.floor(from.army * 0.5);
            from.army = 2;
            addLog("Saldırı başarısız oldu!");
        }
        selectedId = null;
    }

    function endTurn() {
        year++;
        gold += provinces.filter(p => p.owner === 'player').length * 25;
        
        // AI Hamlesi
        provinces.filter(p => p.owner === 'ai').forEach(aiP => {
            aiP.army += 5; // AI her tur güçlenir
            // AI rastgele oyuncuya saldırır
            let target = provinces.find(p => p.owner === 'player');
            if(aiP.army > target.army + 10) {
                target.army -= 10;
                addLog("AI " + target.name + " bölgesine akın yaptı!");
            }
        });

        addLog(year + " yılına girildi. Gelirler toplandı.");
        draw();
    }

    function addLog(msg) {
        log.innerHTML = `<div>> ${msg}</div>` + log.innerHTML;
    }

    function updateUI() {
        document.getElementById('gold').innerText = gold;
        document.getElementById('year').innerText = year;
        document.getElementById('total-army').innerText = provinces.filter(p => p.owner === 'player').reduce((a, b) => a + b.army, 0);
    }

    draw();
</script>
</body>
</html>
