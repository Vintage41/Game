<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Kalp Yolu - Robot Runner v4</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; background:#05070a; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #wrap { height:100%; display:flex; align-items:center; justify-content:center; }
    canvas {
      width: min(100vw, 500px);
      height: min(100vh, 850px);
      border-radius: 20px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      background: radial-gradient(circle at 50% 20%, #1a2a47 0%, #05070a 100%);
      touch-action: none;
      display:block;
    }
    .ui { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:#fff; text-align:center; }
    .ui > div { pointer-events:auto; background:rgba(10,15,25,0.95); padding:30px; border-radius:25px; width:280px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    h1 { margin:0 0 15px; font-size:28px; letter-spacing:2px; color: #00d4ff; }
    button { 
      display:block; width:100%; padding:14px; margin:10px 0; border:none; border-radius:12px; 
      background:#00d4ff; color:#000; font-weight:bold; cursor:pointer; font-size:16px; transition: 0.2s;
    }
    button:active { transform: scale(0.95); }
    .stats { font-size:14px; opacity:0.8; margin-bottom:20px; line-height:1.6; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="uiMenu" class="ui">
  <div>
    <h1>KALP YOLU</h1>
    <div id="menuStats" class="stats"></div>
    <button id="btnStart">OYUNA BAŞLA</button>
    <button id="btnShop" style="background:#ff007b; color:white;">MARKET</button>
  </div>
</div>

<div id="uiOver" class="ui hidden">
  <div>
    <h1 style="color:#ff4444;">EYVAH!</h1>
    <div id="overStats" class="stats"></div>
    <button id="btnRetry">TEKRAR DENE</button>
    <button id="btnMenu">ANA MENÜ</button>
  </div>
</div>

<script>
/** AYARLAR VE SKINLER **/
const SKINS = {
  classic: { name: "Klasik", body: "#00d4ff", accent: "#ffffff", cost: 0 },
  neon: { name: "Neon", body: "#39ff14", accent: "#000000", cost: 100 },
  sunset: { name: "Sunset", body: "#ff8c00", accent: "#ff007b", cost: 250 },
  noir: { name: "Noir", body: "#444444", accent: "#00ffff", cost: 500 }
};

const defaults = { coins: 0, high: 0, selectedSkin: "classic", owned: ["classic"] };
let state = JSON.parse(localStorage.getItem("kalp_yolu_v4")) || JSON.clone?.(defaults) || {...defaults};
function save() { localStorage.setItem("kalp_yolu_v4", JSON.stringify(state)); }

/** SES MOTORU (Düzeltildi) **/
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicNode = null;

function playSound(freq, type, duration, vol=0.1) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}

const sfx = {
  coin: () => playSound(880, 'sine', 0.2),
  hit: () => playSound(100, 'sawtooth', 0.4, 0.2),
  jump: () => playSound(440, 'triangle', 0.3)
};

function startMusic() {
  if (musicNode) stopMusic();
  const notes = [261.63, 329.63, 392.00, 523.25];
  const randomNote = notes[Math.floor(Math.random() * notes.length)];
  
  musicNode = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  musicNode.type = 'triangle';
  musicNode.frequency.setValueAtTime(randomNote, audioCtx.currentTime);
  g.gain.setValueAtTime(0.02, audioCtx.currentTime);
  musicNode.connect(g); g.connect(audioCtx.destination);
  musicNode.start();
}

function stopMusic() { 
  if(musicNode) { try { musicNode.stop(); } catch(e){} musicNode = null; } 
}

/** OYUN MANTIĞI **/
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H;
function resize() {
  W = canvas.width = canvas.offsetWidth;
  H = canvas.height = canvas.offsetHeight;
}
window.onresize = resize; resize();

let run = null;
const player = { lane: 1, x: 0, baseY: 0, jumpT: 0, slideT: 0 };

function resetRun() {
  stopMusic();
  startMusic();
  run = {
    active: true, score: 0, coins: 0, speed: 0.15,
    objects: [], // hem engeller hem paralar burada
    nextObsZ: 20, nextCoinZ: 10,
    lastObsLane: 1
  };
  player.lane = 1;
  player.x = W/2;
}

/** ÇİZİM FONKSİYONLARI **/
function getPos(lane, z) {
  const roadW = W * 0.8;
  const perspective = 1 / (z + 1);
  const x = W/2 + (lane - 1) * (roadW/3) * (W/500) * (1 / (z*0.5 + 1));
  const y = H * 0.75 - (z * 20); // perspektif derinliği
  return { x, y, scale: perspective };
}

// Robot karakter tasarımı (Geliştirildi)
function drawPlayer() {
  const skin = SKINS[state.selectedSkin] || SKINS.classic;
  const targetX = getPos(player.lane, 0).x;
  player.x += (targetX - player.x) * 0.2;

  let jumpY = 0;
  if (player.jumpT > 0) {
    jumpY = -Math.sin((1 - player.jumpT/0.6) * Math.PI) * 80;
    player.jumpT -= 0.02;
  }
  if (player.slideT > 0) player.slideT -= 0.02;

  const py = H * 0.85 + jumpY;
  
  ctx.save();
  ctx.translate(player.x, py);
  
  // Robot Gövdesi
  ctx.fillStyle = skin.body;
  const w = player.slideT > 0 ? 50 : 40;
  const h = player.slideT > 0 ? 30 : 60;
  
  // Ana metalik şasi
  ctx.beginPath();
  ctx.roundRect(-w/2, -h, w, h, 10);
  ctx.fill();
  
  // Vizör (Gözler)
  ctx.fillStyle = "#000";
  ctx.fillRect(-w/2 + 5, -h + 10, w - 10, 15);
  ctx.fillStyle = skin.accent;
  ctx.fillRect(-w/2 + 10, -h + 15, w - 20, 5); // Parlayan vizör çizgisi
  
  // Enerji Çekirdeği
  ctx.beginPath();
  ctx.arc(0, -h/2 + 5, 5, 0, Math.PI*2);
  ctx.fillStyle = skin.accent;
  ctx.fill();
  
  ctx.restore();
}

function drawWorld() {
  ctx.clearRect(0,0,W,H);
  
  // Yol Çizimi
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.moveTo(W*0.1, H);
  ctx.lineTo(W*0.4, H*0.4);
  ctx.lineTo(W*0.6, H*0.4);
  ctx.lineTo(W*0.9, H);
  ctx.fill();

  // Nesneleri Çiz (Para ve Engeller)
  run.objects.forEach((obj, i) => {
    const p = getPos(obj.lane, obj.z);
    if (obj.z < 0 || obj.z > 50) return;

    if (obj.type === "coin") {
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(p.x, p.y - 20, 10 * p.scale * 5, 0, Math.PI*2);
      ctx.fill();
    } else if (obj.type === "spike") {
      ctx.fillStyle = "#ff4444";
      ctx.beginPath();
      ctx.moveTo(p.x - 20*p.scale*5, p.y);
      ctx.lineTo(p.x, p.y - 40*p.scale*5);
      ctx.lineTo(p.x + 20*p.scale*5, p.y);
      ctx.fill();
    } else if (obj.type === "bar") {
      ctx.fillStyle = "#ffaa00";
      ctx.fillRect(p.x - 30, p.y - 80, 60, 15); // Yüksek engel
    }
  });
}

function loop() {
  if (!run || !run.active) return;

  run.score += run.speed;
  run.speed += 0.00005;

  // Nesne üretimi (Düzeltildi)
  run.nextObsZ -= run.speed;
  run.nextCoinZ -= run.speed;

  if (run.nextObsZ <= 0) {
    const lane = Math.floor(Math.random() * 3);
    run.objects.push({ type: Math.random() > 0.5 ? "spike" : "bar", lane, z: 50 });
    run.nextObsZ = 15 + Math.random() * 20; // Engeller arası mesafe
  }

  if (run.nextCoinZ <= 0) {
    run.objects.push({ type: "coin", lane: Math.floor(Math.random() * 3), z: 50 });
    run.nextCoinZ = 5 + Math.random() * 10;
  }

  // Hareket ve Çarpışma
  run.objects.forEach((obj, i) => {
    obj.z -= run.speed;
    
    // Çarpışma Kontrolü (Z yaklaştığında)
    if (obj.z > 0 && obj.z < 1.5 && obj.lane === player.lane) {
      if (obj.type === "coin") {
        run.coins++;
        state.coins++;
        sfx.coin();
        run.objects.splice(i, 1);
      } else if (obj.type === "spike" && player.jumpT <= 0) {
        gameOver();
      } else if (obj.type === "bar" && player.slideT <= 0) {
        gameOver();
      }
    }
  });

  // Temizlik
  run.objects = run.objects.filter(o => o.z > -2);

  drawWorld();
  drawPlayer();
  
  // Skor Tabelası
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px Arial";
  ctx.fillText(`Puan: ${Math.floor(run.score)}`, 20, 40);
  ctx.fillText(`Para: ${run.coins}`, 20, 70);

  requestAnimationFrame(loop);
}

function gameOver() {
  run.active = false;
  sfx.hit();
  stopMusic();
  if (run.score > state.high) state.high = Math.floor(run.score);
  save();
  document.getElementById("overStats").innerHTML = `Skor: ${Math.floor(run.score)}<br>Toplanan Para: ${run.coins}<br>Rekor: ${state.high}`;
  document.getElementById("uiOver").classList.remove("hidden");
}

/** KONTROLLER **/
window.onkeydown = (e) => {
  if (!run || !run.active) return;
  if (e.key === "ArrowLeft" && player.lane > 0) player.lane--;
  if (e.key === "ArrowRight" && player.lane < 2) player.lane++;
  if (e.key === "ArrowUp" && player.jumpT <= 0) { player.jumpT = 0.6; sfx.jump(); }
  if (e.key === "ArrowDown") player.slideT = 0.6;
};

// UI Tıklamaları
document.getElementById("btnStart").onclick = () => {
  document.getElementById("uiMenu").classList.add("hidden");
  resetRun();
  loop();
};

document.getElementById("btnRetry").onclick = () => {
  document.getElementById("uiOver").classList.add("hidden");
  resetRun();
  loop();
};

document.getElementById("btnMenu").onclick = () => {
  location.reload();
};

document.getElementById("btnShop").onclick = () => {
  alert("Market şu an yapım aşamasında! Mevcut paran: " + state.coins);
};

// Başlangıç ekranı istatistikleri
document.getElementById("menuStats").innerHTML = `En Yüksek Skor: ${state.high}<br>Toplam Para: ${state.coins}`;
</script>
</body>
</html>
