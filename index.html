<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kalp Yolu v7 — Soul Update</title>

<style>
:root{
  --p:#00d4ff;
  --a:#ff4fa3;
  --bg:#050814;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui;overflow:hidden}
#wrap{height:100%;display:flex;justify-content:center;align-items:center}
canvas{
  width:min(100vw,560px);
  height:min(100vh,920px);
  background:radial-gradient(circle at 50% 20%, #0c1a3a, #050814);
  border-radius:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.8);
}

.ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50}
.panel{
  width:360px;
  background:rgba(10,15,35,.9);
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:18px;
  text-align:center;
  backdrop-filter:blur(14px)
}
.hidden{display:none}

button{
  width:100%;padding:14px;margin:8px 0;
  border-radius:14px;border:none;
  background:var(--p);font-weight:900;cursor:pointer
}
button.sec{background:rgba(255,255,255,.08);color:#fff}

#hud{
  position:absolute;top:20px;left:0;width:100%;
  display:flex;justify-content:space-between;
  padding:0 14px;font-weight:900
}
.pill{
  background:rgba(0,0,0,.4);
  padding:8px 12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.1)
}
#toast{
  position:absolute;top:90px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  padding:10px 16px;border-radius:999px;
  font-weight:900;font-size:12px;
  opacity:0;transition:.2s
}
#toast.show{opacity:1}
</style>
</head>

<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="hud" class="hidden">
  <div class="pill">💖 <span id="hudHeart">0</span></div>
  <div class="pill">🌿 Flow <span id="hudFlow">0%</span></div>
</div>
<div id="toast"></div>

<!-- MENU -->
<div id="uiMenu" class="ui">
  <div class="panel">
    <h2 style="color:var(--p);letter-spacing:3px">KALP YOLU</h2>
    <div style="opacity:.7;margin-bottom:10px">v7 – Soul Update</div>
    <button id="btnStart">KOŞUYA BAŞLA</button>
    <button id="btnZen" class="sec">ZEN MOD</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="uiOver" class="ui hidden">
  <div class="panel">
    <h2 style="color:var(--a)">BİTTİ</h2>
    <div id="overText" style="margin:12px 0"></div>
    <button onclick="resetRun()">TEKRAR</button>
    <button onclick="location.reload()" class="sec">MENÜ</button>
  </div>
</div>

<script>
/* ================= CORE ================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");
let W,H;
function resize(){
  W=c.width=c.offsetWidth;
  H=c.height=c.offsetHeight;
}
window.onresize=resize; resize();

/* ================= STATE ================= */
let run=null;
const player={ lane:1, x:0, y:0 };
const lanes=3;

/* ================= AUDIO (HUZURLU) ================= */
const audio = new (window.AudioContext||webkitAudioContext)();
let musicGain=audio.createGain();
musicGain.gain.value=.12;
musicGain.connect(audio.destination);

const pad=audio.createOscillator();
pad.type="triangle";
pad.frequency.value=110;
pad.connect(musicGain);
pad.start();

/* ================= UI ================= */
const toastEl=document.getElementById("toast");
function toast(t){
  toastEl.textContent=t;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"),900);
}

/* ================= GAME START ================= */
function resetRun(zen=false){
  run={
    active:true,
    hearts:0,
    flow:0,
    zen,
    speed:260,
    obstacle:null,
    heart:null
  };
  player.lane=1;
  player.x=W/2;
  player.y=H*0.88;
  document.getElementById("uiMenu").classList.add("hidden");
  document.getElementById("uiOver").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  loop();
}

/* ================= SPAWN ================= */
function laneX(l){
  const rw=W*.7, start=(W-rw)/2;
  return start+(l+.5)*(rw/lanes);
}
function spawnObstacle(){
  run.obstacle={
    lane:Math.floor(Math.random()*3),
    y:-40,w:80,h:30
  };
}
function spawnHeart(){
  run.heart={
    lane:Math.floor(Math.random()*3),
    y:-20,r:16
  };
}

/* ================= LOOP ================= */
function loop(){
  if(!run||!run.active) return;

  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle="#050814";
  ctx.fillRect(0,0,W,H);

  // speed & flow
  run.flow=Math.min(100, run.flow+0.02);
  pad.frequency.value=110+run.flow*0.3;

  // spawn
  if(!run.obstacle && Math.random()<0.02) spawnObstacle();
  if(!run.heart && Math.random()<0.03) spawnHeart();

  // move
  if(run.obstacle){
    run.obstacle.y+=run.speed/60;
    if(run.obstacle.y>H+40) run.obstacle=null;
  }
  if(run.heart){
    run.heart.y+=run.speed/70;
    if(run.heart.y>H+40) run.heart=null;
  }

  // draw obstacle
  if(run.obstacle){
    const o=run.obstacle;
    const x=laneX(o.lane);
    ctx.fillStyle="rgba(255,80,120,.6)";
    ctx.fillRect(x-o.w/2,o.y,o.w,o.h);

    // collision
    if(!run.zen &&
       Math.abs(x-player.x)<40 &&
       Math.abs(o.y-player.y)<30){
      gameOver();
      return;
    }

    // dodge -> flow
    if(o.y>player.y && !o.passed){
      o.passed=true;
      run.flow=Math.min(100, run.flow+8);
    }
  }

  // draw heart (FIXED HITBOX)
  if(run.heart){
    const h=run.heart;
    const x=laneX(h.lane);
    ctx.fillStyle=varColor(run.flow);
    ctx.beginPath();
    ctx.arc(x,h.y,h.r,0,7);
    ctx.fill();

    if(Math.abs(x-player.x)<30 &&
       Math.abs(h.y-player.y)<30){
      run.hearts++;
      run.flow=Math.min(100, run.flow+5);
      toast("+1 💖");
      run.heart=null;
    }
  }

  // player
  player.x+= (laneX(player.lane)-player.x)*.25;
  ctx.fillStyle=varColor(run.flow);
  ctx.fillRect(player.x-25,player.y-60,50,60);

  // HUD
  document.getElementById("hudHeart").textContent=run.hearts;
  document.getElementById("hudFlow").textContent=Math.floor(run.flow)+"%";

  requestAnimationFrame(loop);
}

/* ================= GAME OVER ================= */
function gameOver(){
  run.active=false;
  document.getElementById("uiOver").classList.remove("hidden");
  document.getElementById("overText").innerHTML=
    `Toplanan Kalp: 💖 ${run.hearts}<br>Flow: ${Math.floor(run.flow)}%`;
}

/* ================= COLOR BY FLOW ================= */
function varColor(f){
  return `hsl(${180+f},80%,60%)`;
}

/* ================= INPUT ================= */
window.onkeydown=e=>{
  if(e.key==="ArrowLeft"&&player.lane>0)player.lane--;
  if(e.key==="ArrowRight"&&player.lane<2)player.lane++;
};

let sx=0;
c.ontouchstart=e=>sx=e.touches[0].clientX;
c.ontouchend=e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>30){
    if(dx>0&&player.lane<2)player.lane++;
    if(dx<0&&player.lane>0)player.lane--;
  }
};

/* ================= BUTTONS ================= */
btnStart.onclick=()=>resetRun(false);
btnZen.onclick=()=>resetRun(true);
</script>
</body>
</html>
