<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pax Historia: Global Supremacy</title>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --panel: #121212; --player: #2ecc71; --ai: #e74c3c; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Üst Panel */
        #top-bar { background: var(--panel); border-bottom: 2px solid var(--gold); display: flex; justify-content: space-around; padding: 10px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .stat { color: var(--gold); }

        /* Oyun Alanı */
        #main-stage { display: flex; flex: 1; position: relative; }
        canvas { flex: 1; background: radial-gradient(circle, #1a1c2c 0%, #050505 100%); cursor: crosshair; }

        /* Yan Panel */
        #side-panel { width: 300px; background: var(--panel); border-left: 2px solid var(--gold); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .province-card { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        
        /* Butonlar */
        button { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px; cursor: pointer; transition: 0.3s; border-radius: 4px; font-weight: bold; }
        button:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }
        button:disabled { border-color: #444; color: #444; cursor: not-allowed; }

        /* Oyun Logları */
        #game-logs { height: 150px; background: #000; border: 1px solid #222; padding: 10px; font-size: 11px; overflow-y: auto; color: #888; font-family: monospace; }
        .log-entry { margin-bottom: 5px; border-left: 2px solid var(--gold); padding-left: 5px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div>💰 HAZİNE: <span id="gold-val" class="stat">1000</span></div>
        <div>📅 YIL: <span id="year-val" class="stat">1453</span></div>
        <div>🌍 HAKİMİYET: <span id="dominance-val" class="stat">%20</span></div>
        <button onclick="nextTurn()">TURU BİTİR</button>
    </div>

    <div id="main-stage">
        <canvas id="gameMap"></canvas>

        <div id="side-panel">
            <div id="selection-ui" class="province-card">
                <h3 id="p-name">Bölge Seçilmedi</h3>
                <p>Ordu: <span id="p-army">0</span></p>
                <p>Gelir: <span id="p-income">0</span></p>
            </div>

            <div class="province-card">
                <h4>EMİRLER</h4>
                <button style="width:100%" onclick="actionRecruit()" id="btn-recruit">Asker Al (200 Altın)</button>
                <button style="width:100%; margin-top:5px" onclick="actionFortify()" id="btn-fortify">Savunma Kur (150 Altın)</button>
            </div>

            <div id="game-logs">
                <div class="log-entry">Emirlerinizi bekliyoruz, Efendim.</div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameMap');
    const ctx = canvas.getContext('2d');
    
    let gold = 1000;
    let year = 1453;
    let selectedId = null;

    // Dinamik Dünya Haritası Verisi
    let provinces = [
        { id: 0, name: "Konstantiniyye", x: 450, y: 150, army: 50, income: 100, owner: 'player', color: '#2ecc71' },
        { id: 1, name: "Anadolu", x: 520, y: 180, army: 30, income: 60, owner: 'player', color: '#2ecc71' },
        { id: 2, name: "Balkanlar", x: 380, y: 130, army: 40, income: 50, owner: 'ai', color: '#e74c3c' },
        { id: 3, name: "Viyana", x: 320, y: 100, army: 80, income: 120, owner: 'ai', color: '#e74c3c' },
        { id: 4, name: "Kırım", x: 500, y: 80, army: 20, income: 40, owner: 'neutral', color: '#7f8c8d' },
        { id: 5, name: "Mısır", x: 480, y: 280, army: 45, income: 90, owner: 'neutral', color: '#7f8c8d' }
    ];

    function init() {
        window.addEventListener('resize', resize);
        resize();
        animate();
    }

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Bağlantı Çizgileri (Sınır Komşuluğu)
        ctx.strokeStyle = '#222';
        ctx.setLineDash([5, 5]);
        provinces.forEach(p => {
            provinces.forEach(p2 => {
                if(p.id !== p2.id) {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            });
        });
        ctx.setLineDash([]);

        // Eyaletleri Çiz
        provinces.forEach(p => {
            const isSelected = selectedId === p.id;
            
            // Parlama efekti
            if(isSelected) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = varColor('--gold');
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = p.owner === 'player' ? '#2ecc71' : (p.owner === 'ai' ? '#e74c3c' : '#7f8c8d');
            ctx.beginPath();
            ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Kenarlık
            ctx.strokeStyle = isSelected ? '#fff' : '#000';
            ctx.lineWidth = isSelected ? 3 : 1;
            ctx.stroke();

            // Etiketler
            ctx.fillStyle = "#fff";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y - 35);
            ctx.fillText("⚔️ " + p.army, p.x, p.y + 5);
        });
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let clickedOnTarget = false;

        provinces.forEach(p => {
            const dist = Math.sqrt((mx - p.x)**2 + (my - p.y)**2);
            if(dist < 30) {
                // Eğer zaten bir yer seçiliyse ve tıkladığımız yer düşman ise SALDIR
                if(selectedId !== null && provinces[selectedId].owner === 'player' && p.owner !== 'player') {
                    handleAttack(provinces[selectedId], p);
                } else {
                    selectedId = p.id;
                    updateSelectionUI(p);
                }
                clickedOnTarget = true;
            }
        });

        if(!clickedOnTarget) selectedId = null;
        draw();
    });

    function handleAttack(attacker, target) {
        addLog(`${attacker.name} ordusu ${target.name} bölgesine yürüyor!`);
        
        if(attacker.army > target.army) {
            const casualties = target.army;
            attacker.army -= Math.floor(casualties * 0.6);
            target.owner = 'player';
            target.army = Math.floor(attacker.army * 0.5);
            attacker.army = Math.floor(attacker.army * 0.5);
            addLog(`ZAFER! ${target.name} artık bizim!`);
        } else {
            target.army -= Math.floor(attacker.army * 0.8);
            attacker.army = 5;
            addLog(`HEZİMET! ${target.name} kuşatması başarısız.`);
        }
    }

    function actionRecruit() {
        if(selectedId === null || provinces[selectedId].owner !== 'player') return;
        if(gold >= 200) {
            gold -= 200;
            provinces[selectedId].army += 25;
            addLog(`${provinces[selectedId].name} bölgesine taze kan katıldı.`);
            updateUI();
            draw();
        }
    }

    function nextTurn() {
        year += 1;
        provinces.forEach(p => {
            if(p.owner === 'player') gold += p.income;
            if(p.owner === 'ai') p.army += 10; // AI her tur güçlenir
        });

        // Rastgele bir AI saldırısı simülasyonu
        if(Math.random() > 0.7) {
            let playerP = provinces.find(p => p.owner === 'player');
            playerP.army -= 15;
            addLog(`UYARI: Sınırda çatışma! ${playerP.name} bölgesinde 15 birlik kaybettik.`);
        }

        addLog(`${year} yılına geçildi. Vergiler toplandı.`);
        updateUI();
        draw();
    }

    function updateSelectionUI(p) {
        document.getElementById('p-name').innerText = p.name;
        document.getElementById('p-army').innerText = p.army;
        document.getElementById('p-income').innerText = p.income;
    }

    function updateUI() {
        document.getElementById('gold-val').innerText = gold;
        document.getElementById('year-val').innerText = year;
        const dominance = (provinces.filter(p => p.owner === 'player').length / provinces.length) * 100;
        document.getElementById('dominance-val').innerText = `%${Math.floor(dominance)}`;
    }

    function addLog(msg) {
        const logs = document.getElementById('game-logs');
        logs.innerHTML = `<div class="log-entry">${msg}</div>` + logs.innerHTML;
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

    function animate() {
        draw();
        requestAnimationFrame(animate);
    }

    init();
</script>
</body>
</html>
