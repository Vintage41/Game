<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Kalp Yolu: Robot Runner v5</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; height:100%; background:#05070a; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #wrap { height:100%; display:flex; align-items:center; justify-content:center; }
    canvas {
      width: min(100vw, 500px);
      height: min(100vh, 850px);
      border-radius: 20px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
      background: #000;
      touch-action: none;
      display:block;
    }
    .ui { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:#fff; text-align:center; z-index:10; }
    .ui > div { pointer-events:auto; background:rgba(10,20,35,0.9); padding:40px; border-radius:30px; width:300px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
    h1 { margin:0 0 20px; font-size:32px; letter-spacing:4px; color: #00d4ff; text-shadow: 0 0 15px #00d4ff; }
    button { 
      display:block; width:100%; padding:16px; margin:12px 0; border:none; border-radius:15px; 
      background:#00d4ff; color:#000; font-weight:bold; cursor:pointer; font-size:18px; transition: 0.3s;
    }
    button:hover { filter: brightness(1.2); transform: translateY(-2px); }
    .stats { font-size:16px; opacity:0.9; margin-bottom:25px; line-height:1.8; }
    .hidden { display:none !important; }
    #powerup-ui { position:absolute; top:100px; right:20px; text-align:right; font-weight:bold; color:#00d4ff; text-shadow: 0 0 5px #000; }
  </style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="powerup-ui"></div>

<div id="uiMenu" class="ui">
  <div>
    <h1>KALP YOLU</h1>
    <div id="menuStats" class="stats"></div>
    <button id="btnStart">OYUNU BAŞLAT</button>
    <button id="btnShop" style="background:#ff007b; color:white;">MARKET (YAKINDA)</button>
  </div>
</div>

<div id="uiOver" class="ui hidden">
  <div>
    <h1 style="color:#ff4444;">GAME OVER</h1>
    <div id="overStats" class="stats"></div>
    <button id="btnRetry">YENİDEN DENE</button>
    <button id="btnMenu">MENÜYE DÖN</button>
  </div>
</div>

<script>
/** 1. AYARLAR VE VERİLER **/
const SKINS = {
  classic: { body: "#00d4ff", accent: "#ffffff" },
  neon: { body: "#39ff14", accent: "#fff" },
  sunset: { body: "#ff8c00", accent: "#ff007b" }
};

let state = JSON.parse(localStorage.getItem("kalp_yolu_v5")) || { coins: 0, high: 0, skin: "classic" };
function save() { localStorage.setItem("kalp_yolu_v5", JSON.stringify(state)); }

/** 2. SES SİSTEMİ **/
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSfx(f, type='sine', d=0.2, v=0.1) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, audioCtx.currentTime);
  g.gain.setValueAtTime(v, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + d);
}

const sfx = {
  coin: () => playSfx(1000, 'sine', 0.1),
  hit: () => playSfx(150, 'sawtooth', 0.5, 0.2),
  jump: () => playSfx(400, 'triangle', 0.2),
  power: () => playSfx(800, 'square', 0.3, 0.05)
};

/** 3. OYUN MOTORU **/
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, run = null;
const particles = [];
const trail = [];
const stars = Array.from({length: 50}, () => ({x: Math.random(), y: Math.random(), s: Math.random()}));

function resize() { W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }
window.onresize = resize; resize();

const player = { lane: 1, x: 0, jumpT: 0, slideT: 0, shield: 0, magnet: 0, boost: 0 };

function resetRun() {
  run = {
    active: true, score: 0, coins: 0, speed: 0.15,
    objects: [], nextObjZ: 10, shake: 0
  };
  player.lane = 1; player.x = W/2;
  player.shield = 0; player.magnet = 0; player.boost = 0;
  trail.length = 0;
}

function getPos(lane, z) {
  const p = 1 / (z + 1);
  const x = W/2 + (lane - 1) * (W * 0.3) * p;
  const y = H * 0.7 - (z * 15 * p);
  return { x, y, s: p };
}

/** 4. ÇİZİM VE EFEKTLER **/
function spawnParticle(x, y, color) {
  for(let i=0; i<6; i++) particles.push({x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:1, color});
}

function drawBackground() {
  // Yıldızlar
  ctx.fillStyle = "#fff";
  stars.forEach(s => {
    s.y += run.speed * 0.1; if(s.y > 1) s.y = 0;
    ctx.globalAlpha = s.s;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, 1.5, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Neon Sütunlar (Derinlik hissi için)
  for(let i=0; i<10; i++) {
    const z = (i * 10 - (run.score % 10));
    const pLeft = getPos(-0.5, z);
    const pRight = getPos(2.5, z);
    ctx.fillStyle = `hsla(${run.score % 360}, 70%, 50%, ${1 - z/50})`;
    ctx.fillRect(pLeft.x - 2, pLeft.y - 100 * pLeft.s, 4, 100 * pLeft.s);
    ctx.fillRect(pRight.x - 2, pRight.y - 100 * pRight.s, 4, 100 * pRight.s);
  }
}

function drawPlayer() {
  const skin = SKINS[state.skin];
  const targetX = getPos(player.lane, 0).x;
  player.x += (targetX - player.x) * 0.2;

  let jumpY = 0;
  if(player.jumpT > 0) { jumpY = -Math.sin((1 - player.jumpT/0.6) * Math.PI) * 100; player.jumpT -= 0.016; }
  if(player.slideT > 0) player.slideT -= 0.016;

  // Trail (İz)
  trail.push({x: player.x, y: H * 0.85 + jumpY});
  if(trail.length > 10) trail.shift();
  trail.forEach((t, i) => {
    ctx.globalAlpha = i / 20;
    ctx.fillStyle = player.boost > 0 ? `hsl(${Date.now()%360}, 100%, 50%)` : skin.body;
    ctx.beginPath(); ctx.roundRect(t.x-15, t.y-30, 30, 40, 5); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Robot
  ctx.save();
  ctx.translate(player.x, H * 0.85 + jumpY);
  if(player.shake > 0) { ctx.translate((Math.random()-0.5)*10, 0); player.shake--; }

  const w = player.slideT > 0 ? 50 : 40;
  const h = player.slideT > 0 ? 30 : 60;
  
  // Kalkan Efekti
  if(player.shield > 0) {
    ctx.strokeStyle = "#00d4ff"; ctx.lineWidth = 3; ctx.beginPath();
    ctx.arc(0, -h/2, 50, 0, 7); ctx.stroke();
  }

  ctx.fillStyle = player.boost > 0 ? `hsl(${Date.now()%360}, 100%, 50%)` : skin.body;
  ctx.beginPath(); ctx.roundRect(-w/2, -h, w, h, 10); ctx.fill();
  
  // Göz/Vizör
  ctx.fillStyle = "#000"; ctx.fillRect(-w/2+5, -h+10, w-10, 15);
  ctx.fillStyle = skin.accent; ctx.fillRect(-w/2+10, -h+15, w-20, 3);
  
  ctx.restore();
}

/** 5. ANA DÖNGÜ **/
function loop() {
  if(!run || !run.active) return;
  
  ctx.fillStyle = "#05070a"; ctx.fillRect(0,0,W,H);
  drawBackground();

  run.score += run.speed;
  run.speed += 0.00005;

  // Güçlendirici süreleri
  if(player.shield > 0) player.shield -= 0.016;
  if(player.magnet > 0) player.magnet -= 0.016;
  if(player.boost > 0) { player.boost -= 0.016; run.speed += 0.002; }

  // UI Güncelleme
  document.getElementById("powerup-ui").innerHTML = 
    (player.shield > 0 ? `🛡️ KALKAN: ${player.shield.toFixed(1)}s<br>` : "") +
    (player.magnet > 0 ? `🧲 MIKNATIS: ${player.magnet.toFixed(1)}s<br>` : "") +
    (player.boost > 0 ? `⚡ BOOST: ${player.boost.toFixed(1)}s` : "");

  // Nesne Üretimi
  run.nextObjZ -= run.speed;
  if(run.nextObjZ <= 0) {
    const lane = Math.floor(Math.random()*3);
    const r = Math.random();
    let type = "coin";
    if(r < 0.3) type = "spike";
    else if(r < 0.45) type = "bar";
    else if(r < 0.5) type = ["shield","magnet","boost"][Math.floor(Math.random()*3)];
    
    run.objects.push({type, lane, z: 50});
    run.nextObjZ = 5 + Math.random()*10;
  }

  // Hareket ve Çarpışma
  run.objects.forEach((obj, i) => {
    obj.z -= run.speed;
    
    // Mıknatıs etkisi
    if(player.magnet > 0 && obj.type === "coin" && obj.z < 15) {
      obj.lane += (player.lane - obj.lane) * 0.1;
    }

    const p = getPos(obj.lane, obj.z);
    
    // Çizim
    if(obj.type === "coin") {
      ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(p.x, p.y-20, 15*p.s, 0, 7); ctx.fill();
    } else if(obj.type === "spike") {
      ctx.fillStyle = "#ff4444"; ctx.beginPath(); 
      ctx.moveTo(p.x-20*p.s, p.y); ctx.lineTo(p.x, p.y-50*p.s); ctx.lineTo(p.x+20*p.s, p.y); ctx.fill();
    } else if(obj.type === "bar") {
      ctx.fillStyle = "#ffaa00"; ctx.fillRect(p.x-40*p.s, p.y-80*p.s, 80*p.s, 15*p.s);
    } else { // Güçlendiriciler
      ctx.fillStyle = "#00d4ff"; ctx.font = "20px Arial"; ctx.fillText(obj.type === "shield" ? "🛡️" : obj.type === "magnet" ? "🧲" : "⚡", p.x-10, p.y-20);
    }

    // Çarpışma
    if(obj.z > 0 && obj.z < 1.5 && Math.abs(obj.lane - player.lane) < 0.5) {
      if(obj.type === "coin") {
        run.coins++; state.coins++; sfx.coin(); spawnParticle(p.x, p.y-20, "#ffd700"); run.objects.splice(i,1);
      } else if(["shield","magnet","boost"].includes(obj.type)) {
        player[obj.type] = 10; sfx.power(); run.objects.splice(i,1);
      } else if(player.boost <= 0) { // Engel çarpışması
        if(obj.type === "spike" && player.jumpT <= 0) {
          if(player.shield > 0) { player.shield = 0; run.objects.splice(i,1); run.shake=10; } 
          else gameOver();
        } else if(obj.type === "bar" && player.slideT <= 0) {
          if(player.shield > 0) { player.shield = 0; run.objects.splice(i,1); run.shake=10; }
          else gameOver();
        }
      }
    }
  });

  // Parçacıkları Güncelle
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
    if(p.life <= 0) particles.splice(i,1);
  });
  ctx.globalAlpha = 1;

  run.objects = run.objects.filter(o => o.z > -2);
  drawPlayer();
  
  ctx.fillStyle = "#fff"; ctx.font = "bold 24px Arial";
  ctx.fillText(`${Math.floor(run.score)}m`, W - 80, 40);
  ctx.fillStyle = "#ffd700"; ctx.fillText(`💰 ${run.coins}`, 20, 40);

  requestAnimationFrame(loop);
}

function gameOver() {
  run.active = false; sfx.hit();
  if(run.score > state.high) state.high = Math.floor(run.score);
  save();
  document.getElementById("overStats").innerHTML = `Skor: ${Math.floor(run.score)}m<br>Para: ${run.coins}<br>Rekor: ${state.high}m`;
  document.getElementById("uiOver").classList.remove("hidden");
}

/** 6. KONTROLLER **/
const handleInput = (dir) => {
  if(!run?.active) return;
  if(dir === "left" && player.lane > 0) player.lane--;
  if(dir === "right" && player.lane < 2) player.lane++;
  if(dir === "up" && player.jumpT <= 0) { player.jumpT = 0.6; sfx.jump(); }
  if(dir === "down") player.slideT = 0.6;
};

window.onkeydown = (e) => {
  if(e.key === "ArrowLeft") handleInput("left");
  if(e.key === "ArrowRight") handleInput("right");
  if(e.key === "ArrowUp") handleInput("up");
  if(e.key === "ArrowDown") handleInput("down");
};

// Dokunmatik (Swipe)
let touchY = 0, touchX = 0;
canvas.ontouchstart = e => { touchY = e.touches[0].clientY; touchX = e.touches[0].clientX; };
canvas.ontouchend = e => {
  const dy = e.changedTouches[0].clientY - touchY;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > Math.abs(dy)) handleInput(dx > 0 ? "right" : "left");
  else handleInput(dy > 0 ? "down" : "up");
};

document.getElementById("btnStart").onclick = () => { document.getElementById("uiMenu").classList.add("hidden"); resetRun(); loop(); };
document.getElementById("btnRetry").onclick = () => { document.getElementById("uiOver").classList.add("hidden"); resetRun(); loop(); };
document.getElementById("btnMenu").onclick = () => { location.reload(); };

document.getElementById("menuStats").innerHTML = `Rekor: ${state.high}m<br>Toplam Para: ${state.coins}`;
</script>
</body>
</html>
