<!DOCTYPE html>
<html>
<head>
    <title>Pax Historia Remake</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        canvas { border: 2px solid #d4af37; background: #000; box-shadow: 0 0 20px #d4af37; }
        .ui { margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <h2>🎭 PAX HISTORIA 🎭</h2>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div class="ui">
        <p>Huzuru Koru, Kaostan Kaç!</p>
        <p id="score">Skor: 0</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let player = { x: 300, y: 200, size: 20, color: '#d4af37' }; // Oyuncu (Histrio)
        let chaos = []; // Engeller

        // Hareket kontrolü
        document.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        });

        function spawnChaos() {
            chaos.push({
                x: Math.random() * canvas.width,
                y: -20,
                speed: 2 + Math.random() * 3
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Oyuncuyu çiz
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();

            // Kaosu yönet
            for(let i = 0; i < chaos.length; i++) {
                chaos[i].y += chaos[i].speed;
                ctx.fillStyle = '#ff4d4d';
                ctx.fillRect(chaos[i].x, chaos[i].y, 15, 15);

                // Çarpışma kontrolü
                let dx = player.x - chaos[i].x;
                let dy = player.y - chaos[i].y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.size) {
                    alert("Sahne Kapandı! Skorun: " + score);
                    score = 0;
                    chaos = [];
                }
            }
            
            score++;
            scoreElement.innerText = "Skor: " + score;
            requestAnimationFrame(update);
        }

        setInterval(spawnChaos, 500);
        update();
    </script>
</body>
</html>
