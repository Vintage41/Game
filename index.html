<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />

<body>

<div id="wrap"><canvas id="c"></canvas></div>

<div id="hud" class="hidden">
  <div class="pill" style="color:var(--a)">💖 Run <span id="hudRunHearts">0</span></div>

</div>
<div id="toast"></div>

<!-- MENU -->
<div id="uiMenu" class="ui">
  <div class="panel">
    <div class="brand">
      <h2>KALP YOLU</h2>
      <div class="sub">v7.1 — Fun & Soul Update • Karakter: <b>Canan</b></div>

    <div class="menuStats">

        <div class="k">REKOR</div>

    </div>

    <div class="menuStats">
      <div class="stat">
        <div class="k">SEÇİLİ AURA</div>
        <div class="v" id="menuAura">Soft Glow</div>
      </div>
      <div class="stat">
        <div class="k">GÜNLÜK ÖDÜL</div>
        <div class="v" id="menuDaily">Hazır</div>
      </div>

    <button class="btn" id="btnStart">KOŞUYA BAŞLA</button>

    <div class="row">
      <button class="btn sec" id="btnShop" style="flex:1;">MARKET</button>

      <button class="btn danger" id="btnReset" style="flex:1;">SIFIRLA</button>

<!-- SHOP -->
<div id="uiShop" class="ui hidden">
  <div class="panel">
    <div class="brand">
      <h2 style="margin-bottom:4px;">MARKET</h2>
      <div class="sub">Aura’lar kozmetik. Oynanışı etkilemez.</div>
    </div>

    <div class="stat" style="margin:10px 0 12px; text-align:center;">
      <div class="k">CÜZDAN</div>
      <div class="v" id="shopWallet">0 💖</div>
    </div>

    <div class="scroll" id="shopList"></div>

    <button class="btn sec" id="btnShopBack">GERİ</button>

</div>

<!-- OVER -->
<div id="uiOver" class="ui hidden">
  <div class="panel">
    <h2 style="margin:0;color:var(--a)">OYUN BİTTİ</h2>
    <div id="overText" style="margin:12px 0;opacity:.92;"></div>
    <button class="btn" id="btnRetry">TEKRAR</button>
    <button class="btn sec" id="btnMenu">MENÜ</button>
  </div>
</div>

<script>
/* ====== utils ====== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const deepCopy=(o)=>JSON.parse(JSON.stringify(o));
const dayKey=()=>{ const d=new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); };

/* ====== elements ====== */
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d", { alpha:true });

const hud=document.getElementById("hud");
const hudRunHearts=document.getElementById("hudRunHearts");
const hudWallet=document.getElementById("hudWallet");
const hudFlow=document.getElementById("hudFlow");
const hudMood=document.getElementById("hudMood");
const hudPause=document.getElementById("hudPause");
const hudAuraName=document.getElementById("hudAuraName");
const toastEl=document.getElementById("toast");

const uiMenu=document.getElementById("uiMenu");
const uiShop=document.getElementById("uiShop");
const uiOver=document.getElementById("uiOver");

const menuWallet=document.getElementById("menuWallet");
const menuHigh=document.getElementById("menuHigh");
const menuAura=document.getElementById("menuAura");
const menuDaily=document.getElementById("menuDaily");

const btnStart=document.getElementById("btnStart");
const btnZen=document.getElementById("btnZen");
const btnShop=document.getElementById("btnShop");
const btnDaily=document.getElementById("btnDaily");
const btnReset=document.getElementById("btnReset");
const btnHow=document.getElementById("btnHow");

const shopWallet=document.getElementById("shopWallet");
const shopList=document.getElementById("shopList");
const btnShopBack=document.getElementById("btnShopBack");

const overText=document.getElementById("overText");
const btnRetry=document.getElementById("btnRetry");
const btnMenu=document.getElementById("btnMenu");

/* ====== toast ====== */
function toast(msg, ms=900){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(()=>toastEl.classList.remove("show"), ms);
}

/* ====== canvas resize ====== */
let W=0,H=0,DPR=1;
function resize(){
  const r=canvas.getBoundingClientRect();
  DPR=Math.min(2, Math.max(1, window.devicePixelRatio||1));
  canvas.width=Math.floor(r.width*DPR);
  canvas.height=Math.floor(r.height*DPR);
  W=r.width; H=r.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize, {passive:true});
resize();

/* ====== save/load ====== */
const LS_KEY="kalp_yolu_v71";
const defaults={
  wallet:0,
  high:0,
  aura:"soft",
  ownedAuras:["soft"],
  daily:{ lastClaimKey:0, streak:0 }
};
const AURAS={
  soft:   { n:"Soft Glow",   p:0,   tag:"FREE" },
  pulse:  { n:"Pulse Ring",  p:140, tag:"CLEAN" },
  rainbow:{ n:"Rainbow Soul",p:320, tag:"🌈" }
};

let state=(()=>{
  try{
    const raw=localStorage.getItem(LS_KEY);
    const s=raw ? Object.assign(deepCopy(defaults), JSON.parse(raw)) : deepCopy(defaults);
    if(!AURAS[s.aura]) s.aura="soft";
    if(!Array.isArray(s.ownedAuras)) s.ownedAuras=["soft"];
    if(!s.ownedAuras.includes("soft")) s.ownedAuras.push("soft");
    return s;
  }catch{
    return deepCopy(defaults);
  }
})();
const save=()=>localStorage.setItem(LS_KEY, JSON.stringify(state));

/* ====== audio (safe + flow reactive) ====== */
let audio=null, master=null, musicGain=null, music=null;
function ensureAudio(){
  if(audio) return;
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain(); master.gain.value=0.85; master.connect(audio.destination);
  musicGain=audio.createGain(); musicGain.gain.value=0.12; musicGain.connect(master);
}
async function unlockAudio(){
  try{ ensureAudio(); if(audio.state==="suspended") await audio.resume(); }catch{}
}
function startMusic(){
  ensureAudio();
  if(music) return;

  const pad=audio.createOscillator();
  const lead=audio.createOscillator();
  const filter=audio.createBiquadFilter();
  const g1=audio.createGain();
  const g2=audio.createGain();

  filter.type="lowpass"; filter.frequency.value=850; filter.Q.value=0.7;
  pad.type="triangle"; lead.type="sine";
  pad.frequency.value=110; lead.frequency.value=220;
  g1.gain.value=0.12; g2.gain.value=0.06;

  pad.connect(g1); lead.connect(g2);
  g1.connect(filter); g2.connect(filter);
  filter.connect(musicGain);

  pad.start(); lead.start();
  music={ pad, lead, filter };
}
function stopMusic(){
  if(!music) return;
  try{ music.pad.stop(); music.lead.stop(); }catch{}
  music=null;
}

/* ====== UI navigation ====== */
function showOnly(which){
  uiMenu.classList.add("hidden");
  uiShop.classList.add("hidden");
  uiOver.classList.add("hidden");
  hud.classList.add("hidden");
  if(which==="menu") uiMenu.classList.remove("hidden");
  if(which==="shop") uiShop.classList.remove("hidden");
  if(which==="over") uiOver.classList.remove("hidden");
  if(which==="game") hud.classList.remove("hidden");
}
function dailyReady(){
  return (state.daily?.lastClaimKey||0) !== dayKey();
}
function refreshMenu(){
  menuWallet.textContent=`${state.wallet||0} 💖`;
  menuHigh.textContent=`${state.high||0}m`;
  menuAura.textContent=AURAS[state.aura].n;
  menuDaily.textContent = dailyReady() ? "Hazır" : "Alındı";
  menuDaily.style.color = dailyReady() ? "#39ff14" : "rgba(255,255,255,.70)";
}

/* ====== shop ====== */
function renderShop(){
  shopWallet.textContent=`${state.wallet||0} 💖`;
  shopList.innerHTML="";

  for(const id in AURAS){
    const a=AURAS[id];
    const owned=state.ownedAuras.includes(id);
    const selected=state.aura===id;

    const row=document.createElement("div");
    row.className="card";

    const left=document.createElement("div");
    left.innerHTML=`
      <div style="font-weight:1000">${a.n} <span class="tag">${a.tag}</span></div>
      <div class="muted">${owned ? (selected ? "Seçili ✅" : "Sahipsin") : `Fiyat: <b style="color:var(--a)">${a.p} 💖</b>`}</div>
    `;

    const btn=document.createElement("button");
    btn.className="btn miniBtn";
    btn.textContent = owned ? (selected ? "SEÇİLİ" : "SEÇ") : "AL";
    btn.style.background = owned ? "rgba(255,255,255,.08)" : "linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,79,163,.70))";
    btn.style.color="#fff";

    btn.onclick=()=>{
      unlockAudio();
      if(owned){
        state.aura=id;
        save();
        toast(`Aura seçildi: ${a.n}`, 900);
      }else{
        if((state.wallet||0) < a.p){
          toast("Kalp yetmedi 💀", 900);
          return;
        }
        state.wallet -= a.p;
        state.ownedAuras.push(id);
        state.aura=id;
        save();
        toast(`Alındı: ${a.n} ✨`, 1100);
      }
      renderShop();
      refreshMenu();
    };

    row.appendChild(left);
    row.appendChild(btn);
    shopList.appendChild(row);
  }
}

/* ====== game core ====== */
let run=null, raf=0, lastT=0, paused=false;
const player={ lane:1, x:0, y:0 };
let shake=0;
const pops=[]; // pickup pop effects

function laneX(l){
  const roadW=W*0.74, start=(W-roadW)/2;
  return start + (l+0.5)*(roadW/3);
}
function circleRectHit(cx,cy,r, rx,ry,rw,rh){
  const nx=clamp(cx, rx, rx+rw);
  const ny=clamp(cy, ry, ry+rh);
  const dx=cx-nx, dy=cy-ny;
  return (dx*dx + dy*dy) <= r*r;
}
function rectHit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function pickLaneFair(lastLane){
  let lane=(Math.random()*3)|0;
  if(lastLane!==-1){
    const extreme=(lastLane===0 && lane===2)||(lastLane===2 && lane===0);
    if(extreme && Math.random()<0.75) lane=1;
    if(lane===lastLane && Math.random()<0.70) lane=(lane+1+((Math.random()*2)|0))%3;
  }
  return lane;
}

function resetRun(zen=false){
  paused=false;
  shake=0;
  run={
    active:true,
    zen,
    runHearts:0,
    score:0,
    flow:0.28, // 0..1
    speed:330,
    obstacle:null,
    heart:null,
    nextObs:0.62,
    nextHeart:0.30,
    lastObsLane:-1,
    bgT: Math.random() // for day/night cycle
  };
  player.lane=1;
  player.x=laneX(1);
  player.y=H*0.90;
  pops.length=0;

  showOnly("game");
  hudAuraName.textContent=AURAS[state.aura].n;

  toast(zen ? "Zen Mod 🌙" : "Başladık 💨", 900);
  lastT=performance.now();
  raf=requestAnimationFrame(loop);
}

function gameOver(){
  if(run.zen){
    run.flow=Math.max(0.10, run.flow-0.28);
    run.obstacle=null;
    toast("Zen: devam 😌", 900);
    return;
  }
  run.active=false;
  stopMusic();

  const meters=Math.floor(run.score);
  if(meters > (state.high||0)) state.high=meters;

  save();

  overText.innerHTML =
    `Skor: <b>${meters}m</b><br>`+
    `Toplanan: <b>${run.runHearts} 💖</b><br>`+
    `Flow: <b>${Math.floor(run.flow*100)}%</b><br>`+
    `Cüzdan: <b>${state.wallet} 💖</b>`;

  showOnly("over");
  refreshMenu();
}

function spawnObstacle(){
  const lane=pickLaneFair(run.lastObsLane);
  run.lastObsLane=lane;
  run.obstacle={
    lane,
    x:laneX(lane),
    y:-80,
    w:92,
    h:34,
    passed:false
  };
}
function spawnHeart(){
  // hearts do a gentle zigzag -> less boring
  let lane=(Math.random()*3)|0;
  if(run.obstacle && run.obstacle.lane===lane && run.obstacle.y<240){
    lane=(lane+1)%3;
  }
  run.heart={
    lane,
    baseX:laneX(lane),
    x:laneX(lane),
    y:-30,
    r:18,
    phase:Math.random()*Math.PI*2,
    amp: 8 + Math.random()*8
  };
}

/* ====== visuals: day/night + aura + juice ====== */
function auraColorByFlow(flow){
  // returns a color string (hsl) used for glow
  const hue=190 + flow*70;
  return `hsl(${hue},90%,60%)`;
}

function drawBackground(dt){
  // day/night cycle: smooth, not flashy
  run.bgT = (run.bgT + dt/90) % 1; // ~90s
  const k = 0.5 - 0.5*Math.cos(run.bgT*Math.PI*2); // 0..1
  const night = 1-k;

  // sky gradient
  const top = `rgba(${Math.floor(8+18*k)},${Math.floor(14+26*k)},${Math.floor(36+28*k)},1)`;
  const bot = `rgba(5,8,20,1)`;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, top);
  g.addColorStop(1, bot);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // stars stronger at night
  ctx.globalAlpha = 0.10 + night*0.30;
  ctx.fillStyle="#fff";
  for(let i=0;i<70;i++){
    const x=(i*97)%W;
    const y=(i*53)%H;
    ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha=1;

  // road
  const roadW=W*0.74, x0=(W-roadW)/2, y0=H*0.10;
  ctx.fillStyle="rgba(255,255,255,0.06)";
  ctx.fillRect(x0,y0,roadW,H-y0);

  ctx.strokeStyle="rgba(255,255,255,0.10)";
  ctx.lineWidth=2;
  ctx.setLineDash([10,10]);
  for(let i=1;i<3;i++){
    const lx=x0+i*(roadW/3);
    ctx.beginPath(); ctx.moveTo(lx,y0); ctx.lineTo(lx,H); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawCanan(){
  player.x += (laneX(player.lane)-player.x)*0.28;
  const x=player.x, y=player.y;

  // aura glow by selected aura
  const f=run.flow;
  const glowCol=auraColorByFlow(f);

  if(state.aura==="soft"){
    ctx.globalAlpha=0.12 + f*0.22;
    ctx.strokeStyle=glowCol;
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(x, y-48, 58, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  } else if(state.aura==="pulse"){
    const pulse=0.5+0.5*Math.sin(performance.now()/180);
    ctx.globalAlpha=0.10 + pulse*0.18 + f*0.10;
    ctx.strokeStyle=glowCol;
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(x, y-48, 52 + pulse*10, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  } else if(state.aura==="rainbow"){
    const hue=(performance.now()/12)%360;
    ctx.globalAlpha=0.16 + f*0.18;
    ctx.strokeStyle=`hsl(${hue},90%,60%)`;
    ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(x, y-48, 62, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // body
  ctx.fillStyle="rgba(0,212,255,.95)";
  ctx.beginPath(); ctx.roundRect(x-28,y-78,56,78,18); ctx.fill();

  // visor
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.roundRect(x-22,y-66,44,18,10); ctx.fill();

  // eyes
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x-10,y-57,3.2,0,Math.PI*2);
  ctx.arc(x+10,y-57,3.2,0,Math.PI*2);
  ctx.fill();

  // name tag
  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.beginPath(); ctx.roundRect(x-20,y-40,40,14,8); ctx.fill();
  ctx.fillStyle="#fff";
  ctx.font="900 10px system-ui";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("CANAN", x, y-33);
}

function drawObstacle(o){
  const pulse=0.55 + 0.45*Math.sin(performance.now()/240);
  ctx.fillStyle=`rgba(255,79,163,${0.55 + pulse*0.18})`;
  ctx.beginPath(); ctx.roundRect(o.x-o.w/2, o.y-o.h/2, o.w, o.h, 14); ctx.fill();

  ctx.fillStyle="rgba(255,255,255,.10)";
  ctx.beginPath(); ctx.roundRect(o.x-o.w/2+6, o.y-o.h/2+6, o.w-12, o.h-12, 10); ctx.fill();
}

function drawHeart(h){
  const x=h.x, y=h.y, r=h.r;
  ctx.fillStyle="rgba(255,79,163,.95)";
  ctx.beginPath();
  const top = y - r*0.15;
  ctx.moveTo(x, top + r*0.65);
  ctx.bezierCurveTo(x - r, top, x - r*0.95, top - r*0.55, x, top - r*0.10);
  ctx.bezierCurveTo(x + r*0.95, top - r*0.55, x + r, top, x, top + r*0.65);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha=0.25;
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x-r*0.35, y-r*0.65, r*0.22, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
}

function addPop(x,y){
  pops.push({x,y, t:0, r:12});
}
function drawPops(dt){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i];
    p.t += dt;
    p.r += dt*80;
    const a = 1 - p.t*2.2;
    if(a<=0){ pops.splice(i,1); continue; }
    ctx.globalAlpha=a;
    ctx.strokeStyle="rgba(255,255,255,.75)";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

/* ====== HUD ====== */
function updateHud(){
  hudRunHearts.textContent=run.runHearts;
  hudWallet.textContent=state.wallet||0;
  hudFlow.textContent=`${Math.floor(run.flow*100)}%`;
  hudMood.textContent = run.flow>0.66 ? "😌" : (run.flow>0.35 ? "🙂" : "😰");
  hudAuraName.textContent=AURAS[state.aura].n;
}

/* ====== main loop ====== */
function loop(now){
  if(!run || !run.active) return;

  let dt=(now-lastT)/1000;
  lastT=now;
  dt=Math.min(0.033, Math.max(0, dt));

  // pause render
  if(paused){
    drawBackground(0);
    if(run.obstacle) drawObstacle(run.obstacle);
    if(run.heart) drawHeart(run.heart);
    drawCanan();
    drawPops(0.016);
    raf=requestAnimationFrame(loop);
    return;
  }

  // score meters feel
  run.score += (run.speed*dt)/10;

  // Flow: natural decay -> baseline 0.18
  run.flow = lerp(run.flow, 0.18, dt*0.25);
  run.flow = clamp(run.flow, 0, 1);

  // Music reacts to Flow
  if(music && audio){
    const cutoff = 650 + run.flow*1200;
    music.filter.frequency.setTargetAtTime(cutoff, audio.currentTime, 0.12);
    if(musicGain){
      const targetVol = 0.10 + run.flow*0.08;
      musicGain.gain.setTargetAtTime(targetVol, audio.currentTime, 0.15);
    }
  }

  // spawn timers
  run.nextObs -= dt;
  run.nextHeart -= dt;

  if(!run.obstacle && run.nextObs<=0){
    spawnObstacle();
    run.nextObs = 0.60 + Math.random()*0.40;
  }
  if(!run.heart && run.nextHeart<=0){
    spawnHeart();
    run.nextHeart = 0.26 + Math.random()*0.24;
  }

  // speed progression (no levels)
  run.speed = clamp(run.speed + 14*dt, 330, 560);

  // move
  if(run.obstacle){
    run.obstacle.y += run.speed*dt;
    if(run.obstacle.y > H+120) run.obstacle=null;
  }
  if(run.heart){
    // zigzag: x = baseX + sin(t+phase)*amp
    run.heart.y += run.speed*dt*0.95;
    const t = performance.now()/300;
    run.heart.x = run.heart.baseX + Math.sin(t + run.heart.phase) * run.heart.amp;
    if(run.heart.y > H+60) run.heart=null;
  }

  // player rect
  const pw=52, ph=78;
  const pr = { x:player.x-pw/2, y:player.y-ph, w:pw, h:ph };

  // shake decay
  shake = Math.max(0, shake - dt*22);

  // camera shake transform
  ctx.save();
  if(shake>0){
    const sx=(Math.random()-0.5)*shake;
    const sy=(Math.random()-0.5)*shake*0.6;
    ctx.translate(sx, sy);
  }

  // draw bg
  drawBackground(dt);

  // obstacle: dodge + near-miss + collision
  if(run.obstacle){
    const o=run.obstacle;
    const or = { x:o.x-o.w/2, y:o.y-o.h/2, w:o.w, h:o.h };

    // passed player line => dodge
    if(!o.passed && o.y > player.y){
      o.passed=true;

      run.flow = clamp(run.flow + 0.08, 0, 1);
      toast("Kaçış! 🌿", 650);

      // Near-miss: same lane AND very close => bonus hearts + micro-shake
      const near = (o.lane === player.lane) && Math.abs(o.y - player.y) < 24;
      if(near){
        const bonus=2;
        run.flow = clamp(run.flow + 0.10, 0, 1);
        run.runHearts += bonus;

        state.wallet = (state.wallet||0) + bonus;
        save();

        shake = Math.max(shake, 7); // micro shake
        toast(`Near-miss +${bonus} 💖`, 850);
      }
    }

    drawObstacle(o);

    if(rectHit(pr, or)){
      ctx.restore();
      gameOver();
      if(!run.active) return;
    }
  }

  // heart pickup
  if(run.heart){
    const h=run.heart;
    drawHeart(h);

    if(circleRectHit(h.x,h.y,h.r, pr.x,pr.y,pr.w,pr.h)){
      run.runHearts += 1;
      run.flow = clamp(run.flow + 0.06, 0, 1);

      state.wallet = (state.wallet||0) + 1;
      save();

      addPop(h.x, h.y);
      toast("+1 💖", 650);

      run.heart=null;
    }
  }

  // player
  drawCanan();

  // pops
  drawPops(dt);

  ctx.restore();

  updateHud();
  raf=requestAnimationFrame(loop);
}

/* ====== controls ====== */
function togglePause(){
  if(!run?.active) return;
  paused=!paused;
  toast(paused ? "Duraklatıldı ⏸" : "Devam ▶️", 900);
}
function control(dir){
  if(!run?.active) return;
  if(dir==="L" && player.lane>0) player.lane--;
  if(dir==="R" && player.lane<2) player.lane++;
}

window.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowLeft") control("L");
  if(e.key==="ArrowRight") control("R");
  if(e.key==="Escape") togglePause();
});

let sx=0, sy=0;
canvas.addEventListener("pointerdown", async (e)=>{
  sx=e.clientX; sy=e.clientY;
  await unlockAudio();
  startMusic();
},{passive:true});

canvas.addEventListener("pointerup",(e)=>{
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)){
    if(Math.abs(dx)>18) control(dx>0?"R":"L");
  }else{
    if(Math.abs(dy)>22) togglePause();
  }
},{passive:true});

/* ====== daily reward ====== */
function claimDaily(){
  const today=dayKey();
  if((state.daily?.lastClaimKey||0) === today){
    toast("Günlük zaten alındı 😄", 1100);
    return;
  }
  const reward=25;
  state.wallet = (state.wallet||0) + reward;
  state.daily = state.daily || {};
  state.daily.lastClaimKey = today;
  save();
  toast(`Günlük ödül +${reward} 💖`, 1400);
  refreshMenu();
}

/* ====== roundRect polyfill (older browsers) ====== */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    this.beginPath();
    this.moveTo(x+rr,y);
    this.arcTo(x+w,y,x+w,y+h,rr);
    this.arcTo(x+w,y+h,x,y+h,rr);
    this.arcTo(x,y+h,x,y,rr);
    this.arcTo(x,y,x+w,y,rr);
    this.closePath();
    return this;
  };
}

/* ====== init ====== */
(function init(){
  save();
  refreshMenu();
  showOnly("menu");

  // idle frame
  player.x=laneX(1);
  player.y=H*0.90;
  run={ flow:0.28, bgT:Math.random() }; // fake run for background/canan on menu
  drawBackground(0);
  drawCanan();
  updateHud();
})();
</script>
